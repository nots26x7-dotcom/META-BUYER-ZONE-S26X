<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>META BUYER ZONE — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #030712;
      --bg2:         #070b14;
      --card:        rgba(13,20,40,0.88);
      --card-solid:  #0d1428;
      --glass:       rgba(255,255,255,0.03);
      --border:      rgba(255,255,255,0.07);
      --border-hi:   rgba(255,255,255,0.13);
      --text:        #f0f4ff;
      --subtext:     #6b7fa3;
      --blue:        #3b82f6;
      --blue-glow:   rgba(59,130,246,0.35);
      --cyan:        #00e5ff;
      --cyan-glow:   rgba(0,229,255,0.3);
      --purple:      #a855f7;
      --purple-glow: rgba(168,85,247,0.3);
      --emerald:     #10d980;
      --emerald-glow:rgba(16,217,128,0.3);
      --crimson:     #f43f5e;
      --crimson-glow:rgba(244,63,94,0.3);
      --gold:        #fbbf24;
      --gold-glow:   rgba(251,191,36,0.3);
      --warning:     #f59e0b;
    }

    * { box-sizing:border-box; font-family:'Urbanist',sans-serif; -webkit-tap-highlight-color:transparent; outline:none; margin:0; padding:0; }

    html,body { background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

    body { padding:0 0 40px; }

    /* ===== PARTICLES ===== */
    #cv { position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; }

    /* ===== ACCESS DENIED ===== */
    #access-denied {
      position:fixed; inset:0; background:var(--bg); z-index:10000;
      display:none; align-items:center; justify-content:center; padding:24px;
    }
    .denied-box {
      background:rgba(13,20,40,0.95); border:1px solid rgba(244,63,94,0.3);
      border-radius:32px; padding:36px 30px; text-align:center; width:100%; max-width:340px;
      box-shadow:0 0 60px rgba(244,63,94,0.15), 0 30px 60px rgba(0,0,0,0.8);
      animation:riseUp 0.5s ease both;
    }
    .denied-icon { font-size:56px; margin-bottom:14px; filter:drop-shadow(0 0 20px rgba(244,63,94,0.6)); }
    .denied-title { font-size:22px; font-weight:900; color:var(--crimson); margin-bottom:10px; }
    .denied-text  { font-size:13px; color:var(--subtext); line-height:1.65; margin-bottom:22px; }

    /* ===== MAIN LAYOUT ===== */
    #admin-panel { position:relative; z-index:1; display:none; max-width:520px; margin:0 auto; padding:16px 14px; }

    /* ===== HEADER ===== */
    .admin-header {
      display:flex; align-items:center; justify-content:space-between;
      background:rgba(13,20,40,0.85); border:1px solid var(--border);
      border-radius:24px; padding:14px 18px; margin-bottom:16px;
      backdrop-filter:blur(20px);
      box-shadow:0 8px 30px rgba(0,0,0,0.4);
    }
    .header-brand { font-size:14px; font-weight:900; color:var(--cyan); letter-spacing:1px; }
    .header-sub   { font-size:10px; font-weight:700; color:var(--subtext); letter-spacing:1.5px; margin-top:2px; }
    .back-btn {
      background:rgba(255,255,255,0.05); border:1px solid var(--border);
      border-radius:14px; padding:9px 16px; color:var(--subtext);
      font-size:13px; font-weight:800; cursor:pointer; transition:all 0.15s;
    }
    .back-btn:active { transform:scale(0.95); background:rgba(255,255,255,0.08); }

    /* ===== STAT ROW ===== */
    .stats-row { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:14px; }
    .stat-box {
      background:var(--card); border:1px solid var(--border);
      border-radius:20px; padding:16px 20px;
      display:flex; align-items:center; gap:14px;
      backdrop-filter:blur(16px);
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
    }
    .stat-icon { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
    .stat-label { font-size:10px; font-weight:800; letter-spacing:1.5px; color:var(--subtext); }
    .stat-value { font-size:26px; font-weight:900; line-height:1; margin-top:3px; }

    /* ===== TAB STRIP ===== */
    .tab-strip {
      display:flex; background:rgba(0,0,0,0.3); border-radius:18px; padding:5px;
      gap:4px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none;
      border:1px solid var(--border);
    }
    .tab-strip::-webkit-scrollbar { display:none; }
    .tab-item {
      flex:1; min-width:72px; padding:10px 8px;
      border-radius:14px; border:none; background:none;
      color:var(--subtext); font-size:10px; font-weight:900;
      letter-spacing:0.5px; cursor:pointer; transition:all 0.2s ease;
      display:flex; flex-direction:column; align-items:center; gap:3px; white-space:nowrap;
    }
    .tab-item.active { background:linear-gradient(135deg,rgba(59,130,246,0.25),rgba(0,229,255,0.12)); color:var(--cyan); border:1px solid rgba(0,229,255,0.2); box-shadow:0 4px 14px rgba(0,229,255,0.1); }
    .tab-badge {
      background:rgba(255,255,255,0.08); color:var(--text);
      font-size:9px; font-weight:800; padding:1px 7px; border-radius:8px; min-width:20px; text-align:center;
    }
    .tab-item.active .tab-badge { background:rgba(0,229,255,0.15); color:var(--cyan); }

    /* ===== ORDER CARD ===== */
    .order-card {
      background:var(--card); border:1px solid var(--border);
      border-radius:22px; padding:16px; margin-bottom:12px;
      backdrop-filter:blur(16px);
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      animation:riseUp 0.35s ease both;
      border-left:4px solid var(--blue);
      position:relative;
    }
    .order-card.pending  { border-left-color:var(--warning); }
    .order-card.completed{ border-left-color:var(--cyan); }
    .order-card.rejected { border-left-color:var(--crimson); }

    .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .order-user   { font-size:15px; font-weight:900; }
    .order-id     { font-size:10px; color:var(--subtext); font-weight:700; }
    .order-badge  {
      font-size:9px; font-weight:900; letter-spacing:1.5px;
      padding:4px 10px; border-radius:8px;
    }
    .badge-pending  { background:rgba(245,158,11,0.12); color:var(--gold);    border:1px solid rgba(245,158,11,0.25); }
    .badge-completed{ background:rgba(0,229,255,0.08);  color:var(--cyan);    border:1px solid rgba(0,229,255,0.2); }
    .badge-rejected { background:rgba(244,63,94,0.08);  color:var(--crimson); border:1px solid rgba(244,63,94,0.2); }

    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
    .info-cell {
      background:rgba(255,255,255,0.03); border:1px solid var(--border);
      border-radius:12px; padding:9px 11px;
    }
    .info-cell small { font-size:8px; font-weight:900; letter-spacing:1.5px; color:var(--subtext); display:block; margin-bottom:3px; }
    .info-cell b { font-size:12px; font-weight:800; color:var(--text); }

    .order-actions { display:flex; gap:8px; }
    .btn-accept {
      flex:2; background:linear-gradient(135deg,var(--emerald),rgba(16,217,128,0.7));
      border:none; color:#000; padding:11px; border-radius:13px; font-size:12px; font-weight:900;
      cursor:pointer; transition:all 0.15s; letter-spacing:0.5px;
    }
    .btn-accept:active { transform:scale(0.96); }
    .btn-reject {
      flex:1; background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.25);
      color:var(--crimson); padding:11px; border-radius:13px; font-size:12px; font-weight:900;
      cursor:pointer; transition:all 0.15s;
    }
    .btn-reject:active { transform:scale(0.96); }
    .btn-del {
      background:rgba(255,255,255,0.05); border:1px solid var(--border);
      color:var(--subtext); padding:11px 14px; border-radius:13px; font-size:11px; font-weight:800;
      cursor:pointer; transition:all 0.15s;
    }
    .btn-del:active { transform:scale(0.96); }

    /* ===== SETTINGS PANEL ===== */
    .settings-section { display:none; }
    .settings-group {
      background:var(--card); border:1px solid var(--border);
      border-radius:24px; padding:20px; margin-bottom:14px;
      backdrop-filter:blur(16px); animation:riseUp 0.35s ease both;
    }
    .settings-group-title {
      display:flex; align-items:center; gap:10px;
      font-size:13px; font-weight:900; letter-spacing:1.5px;
      margin-bottom:16px; padding-bottom:12px;
      border-bottom:1px solid var(--border);
    }
    .stitle-bar { width:3px; height:16px; border-radius:2px; flex-shrink:0; }

    .form-input {
      width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--border);
      border-radius:13px; padding:12px 14px; font-size:13px; font-weight:600;
      color:var(--text); margin-bottom:9px; transition:all 0.2s;
      font-family:'Urbanist',sans-serif;
    }
    .form-input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,229,255,0.08); }
    .form-input option { background:#0d1428; }
    .form-input::placeholder { color:var(--subtext); }
    .form-input:last-child { margin-bottom:0; }

    .form-row2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }

    .btn-action {
      width:100%; border:none; padding:12px; border-radius:14px;
      font-size:13px; font-weight:900; cursor:pointer;
      transition:all 0.15s; letter-spacing:0.5px; font-family:'Urbanist',sans-serif;
    }
    .btn-action:active { transform:scale(0.96); }
    .btn-blue    { background:linear-gradient(135deg,var(--blue),rgba(59,130,246,0.7)); color:#fff; box-shadow:0 6px 20px var(--blue-glow); }
    .btn-cyan    { background:linear-gradient(135deg,var(--cyan),rgba(0,229,255,0.7)); color:#000; box-shadow:0 6px 20px var(--cyan-glow); }
    .btn-emerald { background:linear-gradient(135deg,var(--emerald),rgba(16,217,128,0.7)); color:#000; box-shadow:0 6px 20px var(--emerald-glow); }
    .btn-danger  { background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.25); color:var(--crimson); }

    /* ===== COIN BOX ===== */
    .coin-box {
      background:rgba(0,0,0,0.25); border:1px solid var(--border);
      border-radius:18px; padding:14px; margin-bottom:12px;
      border-left:3px solid var(--emerald);
      animation:riseUp 0.3s ease both;
    }
    .coin-box.offline { border-left-color:var(--crimson); }
    .coin-box-header  { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .coin-name-row { display:flex; align-items:center; gap:8px; }
    .coin-logo-sm  { width:30px; height:30px; border-radius:9px; object-fit:cover; }
    .coin-key      { font-size:16px; font-weight:900; color:var(--cyan); }

    .rate-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
    .rate-cell { background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:11px; padding:9px 11px; }
    .rate-cell small { font-size:8px; font-weight:900; letter-spacing:1px; color:var(--subtext); display:block; margin-bottom:4px; }
    .rate-cell input { background:none; border:none; color:var(--cyan); font-weight:800; font-size:13px; width:100%; font-family:'Urbanist',sans-serif; padding:0; }

    /* ===== SWITCH ===== */
    .switch { position:relative; display:inline-block; width:40px; height:22px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background:rgba(255,255,255,0.1); border-radius:34px; transition:.35s; cursor:pointer; border:1px solid var(--border); }
    .slider::before { position:absolute; content:""; height:16px; width:16px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.35s; }
    input:checked + .slider { background:var(--emerald); border-color:var(--emerald); box-shadow:0 0 10px var(--emerald-glow); }
    input:checked + .slider::before { transform:translateX(18px); }

    /* ===== USER ROW (Leaderboard) ===== */
    .user-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:11px 14px; background:rgba(0,0,0,0.2); border-radius:14px;
      margin-bottom:8px; border:1px solid var(--border);
    }
    .user-name   { font-size:14px; font-weight:800; }
    .user-amount { font-size:12px; font-weight:700; color:var(--cyan); margin-top:2px; }
    .del-btn { background:none; border:none; color:var(--crimson); font-size:12px; font-weight:900; cursor:pointer; padding:6px 10px; border-radius:9px; transition:all 0.15s; }
    .del-btn:active { background:rgba(244,63,94,0.1); transform:scale(0.95); }

    /* ===== PAYMENT ROW ===== */
    .pay-row { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--border); }
    .pay-row:last-child { border-bottom:none; }
    .pay-name { font-size:14px; font-weight:800; }
    .pay-controls { display:flex; gap:10px; align-items:center; }

    /* ===== ADD FORM ===== */
    .add-form {
      background:rgba(0,0,0,0.2); border:1px dashed rgba(0,229,255,0.2);
      border-radius:16px; padding:14px; margin-bottom:14px;
    }

    /* ===== TOAST ===== */
    .toast {
      position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
      background:rgba(13,20,40,0.96); border:1px solid var(--border-hi);
      border-radius:14px; padding:11px 22px; font-size:13px; font-weight:800;
      z-index:9000; opacity:0; transition:all 0.3s ease; white-space:nowrap;
      backdrop-filter:blur(20px); pointer-events:none;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ===== EMPTY STATE ===== */
    .empty-state { text-align:center; padding:40px 20px; color:var(--subtext); font-size:13px; font-weight:600; }
    .empty-icon  { font-size:36px; margin-bottom:10px; opacity:0.4; }

    /* ===== ANIMATIONS ===== */
    @keyframes riseUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
  </style>
</head>

    <!-- Payments -->

      <div class="settings-group-title">

        <input type="text" id="new-pay" class="form-input" placeholder="Method Name (e.g. bKash)" style="margin-bottom:0;flex:1;">

  </div><!-- /settings-section -->

<script>
/* ===== PARTICLES ===== */
(function(){
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');
  let W,H,pts=[];
  const C=['rgba(0,229,255,0.4)','rgba(59,130,246,0.45)','rgba(168,85,247,0.3)','rgba(255,255,255,0.2)'];
  function resize(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
  resize(); window.addEventListener('resize',resize);
  function mk(){ return {x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,vx:(Math.random()-.5)*.3,vy:-(Math.random()*.7+.2),c:C[Math.floor(Math.random()*C.length)],a:Math.random()*.55+.25}; }
  for(let i=0;i<50;i++) pts.push(mk());
  function draw(){
    cx.clearRect(0,0,W,H);
    for(const p of pts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
      if(p.x<-4||p.x>W+4){p.x=Math.random()*W;p.y=H+4;}
      cx.globalAlpha=p.a; cx.fillStyle=p.c;
      cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill();
    }
    cx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ===== TELEGRAM ===== */
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const ADMIN_IDS = [8505710811, 8583821482];
const tgUser = tg.initDataUnsafe.user || {};
const currentUserId = Number(tgUser.id || 0);
const isAdmin = ADMIN_IDS.includes(currentUserId);

/* ===== INIT ===== */
window.addEventListener('DOMContentLoaded', ()=>{
  if(isAdmin){
    document.getElementById('admin-panel').style.display = 'block';
    document.getElementById('admin-panel').style.animation = 'fadeIn 0.4s ease';
    startSystem();
  } else {
    document.getElementById('access-denied').style.display = 'flex';
  }
});

/* ===== TOAST ===== */
function showToast(msg, color='var(--cyan)'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.borderColor=color; t.style.color=color;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

/* ===== TABS ===== */
let currentTab = 'pending';
let globalOrders = {};

function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const isSettings = tab==='settings';
  document.getElementById('order-section').style.display   = isSettings?'none':'block';
  document.getElementById('settings-section').style.display= isSettings?'block':'none';
  if(!isSettings) renderOrders();
}

/* ===== MAIN SYSTEM ===== */
function startSystem(){
  // Real-time orders listener
  db.ref('orders').on('value', snap=>{
    globalOrders = snap.val() || {};
    const cnt = {pending:0, completed:0, rejected:0};
    Object.values(globalOrders).forEach(o=>{ if(cnt[o.status]!==undefined) cnt[o.status]++; });
    document.getElementById('stat-pending').textContent    = cnt.pending;
    document.getElementById('cnt-pending').textContent     = cnt.pending;
    document.getElementById('cnt-completed').textContent   = cnt.completed;
    document.getElementById('cnt-rejected').textContent    = cnt.rejected;
    if(currentTab !== 'settings') renderOrders();
  });

  // Leaderboard listener
  db.ref('leaderboard').on('value', snap=>{
    const users = snap.val()||{};
    const arr = Object.values(users).sort((a,b)=>b.totalAmount-a.totalAmount);
    let h = arr.map(u=>{
      const name = u.user.startsWith('@')?u.user.slice(1):u.user;
      const safeUser = encodeURIComponent(u.user);
      return `<div class="user-row">
        <div>
          <div class="user-name">${name}</div>
          <div class="user-amount">${Number(u.totalAmount||0).toFixed(2)}৳</div>
        </div>
        <button class="del-btn" onclick="delLeaderboardUser('${u.user.replace(/'/g,"\\'")}')">DEL</button>
      </div>`;
    }).join('');
    document.getElementById('leaderboard-list').innerHTML = h||'<div class="empty-state"><div class="empty-icon">🏆</div>No users yet</div>';
  });

  renderCoinList();
  renderPaymentList();
  loadBranding();
}

/* ===== RENDER ORDERS ===== */
function renderOrders(){
  const arr = Object.values(globalOrders)
    .filter(o=>o.status===currentTab)
    .sort((a,b)=>(b.timestamp||b.id)-(a.timestamp||a.id));

  if(!arr.length){
    document.getElementById('order-list').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>No orders here</div>';
    return;
  }

  const h = arr.map((o,i)=>{
    const bClass = `badge-${o.status}`;
    const cardClass = o.status;
    const ts = o.timestamp ? new Date(o.timestamp).toLocaleString('en-BD',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}) : '';
    const actionBtns = o.status==='pending'
      ? `<button class="btn-accept" onclick="updOrd('${o.id}','completed','${(o.user||'').replace(/'/g,"\\'")}',${o.payable||0})">✓ Accept</button>
         <button class="btn-reject" onclick="updOrd('${o.id}','rejected')">✗ Reject</button>`
      : '';
    return `<div class="order-card ${cardClass}" style="animation-delay:${i*0.04}s;">
      <div class="order-header">
        <div>
          <div class="order-user">@${o.user||'—'}</div>
          <div class="order-id">#${String(o.id).slice(-5)} · ${ts}</div>
        </div>
        <span class="order-badge ${bClass}">${o.status.toUpperCase()}</span>
      </div>
      <div class="info-grid">
        <div class="info-cell"><small>PAY TO</small><b>${o.number||'—'} (${o.method||'—'})</b></div>
        <div class="info-cell"><small>COIN</small><b>${o.amt||0} ${o.coin||'—'}</b></div>
        <div class="info-cell"><small>SENDER</small><b>${o.sender||'—'}</b></div>
        <div class="info-cell"><small>PAYOUT</small><b style="color:var(--cyan);">${o.payable||0}৳</b></div>
        <div class="info-cell"><small>RATE USED</small><b>${o.appliedRate||0}৳ (${o.appliedRateType||'user'})</b></div>
        <div class="info-cell"><small>TARGET ID</small><b style="font-size:10px;">${o.targetId||'—'}</b></div>
      </div>
      <div class="order-actions">
        ${actionBtns}
        <button class="btn-del" onclick="delOrder('${o.id}')">Del</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('order-list').innerHTML = h;
}

/* ===== ORDER ACTIONS ===== */
function updOrd(id, status, user, payable){
  // Optimistic update
  if(globalOrders[id]) globalOrders[id].status = status;
  renderOrders();

  const updates = { [`orders/${id}/status`]: status };
  db.ref().update(updates);

  if(status==='completed' && user && payable){
    db.ref('leaderboard/'+user).once('value', sn=>{
      const d = sn.val() || { totalAmount:0, user };
      db.ref('leaderboard/'+user).update({
        user,
        totalAmount: parseFloat(((parseFloat(d.totalAmount)||0) + parseFloat(payable||0)).toFixed(2))
      });
    });
    showToast('✓ Order Accepted & Leaderboard Updated','var(--emerald)');
  } else if(status==='rejected'){
    showToast('Order Rejected','var(--warning)');
  }
  try{tg.HapticFeedback.notificationOccurred('success');}catch(e){}
}

function delOrder(id){
  if(!confirm('Delete this order permanently?')) return;
  if(globalOrders[id]) delete globalOrders[id];
  renderOrders();
  db.ref('orders/'+id).remove();
  showToast('Order deleted','var(--subtext)');
}

function delLeaderboardUser(user){
  if(!confirm(`Remove ${user} from leaderboard?`)) return;
  db.ref('leaderboard/'+user).remove().then(()=>showToast('User removed','var(--subtext)'));
}

function confirmClearLeaderboard(){
  if(!confirm('Clear ALL leaderboard rankings? This cannot be undone.')) return;
  db.ref('leaderboard').remove().then(()=>showToast('Leaderboard cleared','var(--warning)'));
}

/* ===== COIN MANAGEMENT ===== */
function renderCoinList(){
  db.ref('marketConfig').on('value', snap=>{
    let h='';
    snap.forEach(c=>{
      const v=c.val(); const key=c.key;
      const logoSrc = v.logo||'';
      const logoEl = logoSrc
        ? `<img src="${logoSrc}" class="coin-logo-sm" onerror="this.style.display='none'">`
        : `<span style="font-size:18px;">💰</span>`;
      h += `<div class="coin-box ${v.status?'':'offline'}">
        <div class="coin-box-header">
          <div class="coin-name-row">${logoEl}<span class="coin-key">${key}</span></div>
          <label class="switch">
            <input type="checkbox" ${v.status?'checked':''} onchange="db.ref('marketConfig/${key}').update({status:this.checked})">
            <span class="slider"></span>
          </label>
        </div>
        <input class="form-input" type="text"   value="${v.logo||''}"       placeholder="Logo URL"       onchange="db.ref('marketConfig/${key}').update({logo:this.value})">
        <input class="form-input" type="text"   value="${v.transferId||''}" placeholder="Transfer ID"    onchange="db.ref('marketConfig/${key}').update({transferId:this.value})">
        <div class="rate-grid">
          <div class="rate-cell"><small>USER RATE</small><input type="number" value="${v.userRate||0}"         onchange="db.ref('marketConfig/${key}').update({userRate:parseFloat(this.value)||0})"></div>
          <div class="rate-cell"><small>ADMIN RATE</small><input type="number" value="${v.adminRate||0}"       onchange="db.ref('marketConfig/${key}').update({adminRate:parseFloat(this.value)||0})"></div>
        </div>
        <div class="rate-grid">
          <div class="rate-cell"><small>ADMIN FROM</small><input type="number" value="${v.adminRateMinCoins||0}" onchange="db.ref('marketConfig/${key}').update({adminRateMinCoins:parseFloat(this.value)||0})"></div>
          <div class="rate-cell"><small>MIN SUBMIT</small><input type="number" value="${v.minSubmitLimit||0}"   onchange="db.ref('marketConfig/${key}').update({minSubmitLimit:parseFloat(this.value)||0})"></div>
        </div>
        <button class="btn-action btn-danger" style="margin-top:10px;font-size:11px;padding:9px;" onclick="if(confirm('Remove ${key}?')) db.ref('marketConfig/${key}').remove()">Remove Coin</button>
      </div>`;
    });
    document.getElementById('coin-list').innerHTML = h || '<div class="empty-state" style="padding:20px 0;"><div class="empty-icon">🪙</div>No coins configured</div>';
  });
}

function addCoin(){
  const n   = document.getElementById('c-name').value.trim();
  const l   = document.getElementById('c-logo').value.trim();
  const tid = document.getElementById('c-tid').value.trim();
  const ur  = document.getElementById('c-user-rate').value;
  const ar  = document.getElementById('c-admin-rate').value;
  const arm = document.getElementById('c-admin-min').value;
  const msl = document.getElementById('c-min-submit').value;
  if(!n||!tid||!ur||!ar||!arm||!msl){ showToast('Fill all required fields','var(--crimson)'); return; }
  db.ref('marketConfig/'+n).set({
    transferId:tid, logo:l, userRate:parseFloat(ur)||0, adminRate:parseFloat(ar)||0,
    adminRateMinCoins:parseFloat(arm)||0, minSubmitLimit:parseFloat(msl)||0, status:true
  }).then(()=>{
    ['c-name','c-logo','c-tid','c-user-rate','c-admin-rate','c-admin-min','c-min-submit']
      .forEach(id=>document.getElementById(id).value='');
    showToast('✓ Coin Added','var(--emerald)');
  });
}

/* ===== BRANDING ===== */
function normalizeLink(url){
  const v=(url||'').trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)||/^tg:\/\//i.test(v)) return v;
  if(/^(t\.me|telegram\.me)\//i.test(v)) return 'https://'+v;
  if(/^@/.test(v)) return 'https://t.me/'+v.slice(1);
  return 'https://'+v;
}
function loadBranding(){
  db.ref('settings/branding').on('value', snap=>{
    const b=snap.val()||{};
    const name = b.siteName||'META BUYER ZONE';
    document.getElementById('site-name').value=name;
    document.getElementById('admin-brand-name').textContent=name;
    document.title=name+' — Admin';
  });
  db.ref('settings/links').on('value', snap=>{
    const d=snap.val()||{};
    document.getElementById('link-channel').value=d.channel||'';
    document.getElementById('link-help').value=d.help||'';
  });
}
function saveBranding(){
  const siteName = (document.getElementById('site-name').value||'META BUYER ZONE').trim()||'META BUYER ZONE';
  const channel  = normalizeLink(document.getElementById('link-channel').value);
  const help     = normalizeLink(document.getElementById('link-help').value);
  Promise.all([
    db.ref('settings/branding').set({siteName}),
    db.ref('settings/links').set({channel,help})
  ]).then(()=>{
    document.getElementById('link-channel').value=channel;
    document.getElementById('link-help').value=help;
    showToast('✓ Branding Saved','var(--emerald)');
  });
}

/* ===== PAYMENT METHODS ===== */
function addPayment(){
  const name=document.getElementById('new-pay').value.trim();
  if(!name){ showToast('Enter method name','var(--crimson)'); return; }
  db.ref('paymentMethods/'+name).set({status:true}).then(()=>{
    document.getElementById('new-pay').value='';
    showToast('✓ Method Added','var(--emerald)');
  });
}
function renderPaymentList(){
  db.ref('paymentMethods').on('value', snap=>{
    let h='';
    snap.forEach(p=>{
      const key=p.key; const on=p.val().status;
      h+=`<div class="pay-row">
        <div class="pay-name">${key}</div>
        <div class="pay-controls">
          <label class="switch">
            <input type="checkbox" ${on?'checked':''} onchange="db.ref('paymentMethods/${key}').update({status:this.checked})">
            <span class="slider"></span>
          </label>
          <button class="del-btn" onclick="if(confirm('Remove ${key}?')) db.ref('paymentMethods/${key}').remove()">DEL</button>
        </div>
      </div>`;
    });
    document.getElementById('payment-list').innerHTML=h||'<div style="color:var(--subtext);font-size:12px;text-align:center;padding:12px 0;">No methods added</div>';
  });
}
</script>
</body>
